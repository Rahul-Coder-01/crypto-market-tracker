<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Crypto Market Tracker</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
  >
</head>

<body class="bg-slate-950 text-white min-h-screen">

  <!-- Header -->
  <header class="bg-slate-900 border-b border-slate-800 p-5">
    <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-4">

      <h1 class="text-2xl font-bold text-yellow-400">
        <i class="fa-brands fa-bitcoin"></i>
        Crypto Tracker
      </h1>

      <p class="text-gray-400 text-sm">
        Cryptocurrency Market Dashboard
      </p>

    </div>
  </header>

  <main class="max-w-7xl mx-auto p-5">

    <!-- Search and Controls -->
    <section class="flex flex-col md:flex-row gap-3 mb-8">

      <input
        type="text"
        id="searchInput"
        placeholder="Search any cryptocurrency..."
        class="flex-1 bg-slate-800 border border-slate-700 rounded-lg p-3 outline-none focus:border-yellow-400"
      >

      <select
        id="sortSelect"
        class="bg-slate-800 border border-slate-700 rounded-lg p-3"
      >
        <option value="market_cap_desc">Market Cap</option>
        <option value="price_desc">Price: High to Low</option>
        <option value="price_asc">Price: Low to High</option>
        <option value="change_desc">24h Change: High to Low</option>
      </select>

      <button
        id="refreshBtn"
        class="bg-blue-600 hover:bg-blue-700 rounded-lg px-5 py-3"
      >
        <i class="fa-solid fa-rotate-right mr-2"></i>
        Refresh
      </button>

      <button
        id="watchlistBtn"
        class="bg-yellow-600 hover:bg-yellow-700 rounded-lg px-5 py-3"
      >
        <i class="fa-solid fa-star mr-2"></i>
        Watchlist
      </button>

      <button
        id="homeBtn"
        class="bg-slate-700 hover:bg-slate-600 rounded-lg px-5 py-3"
      >
        <i class="fa-solid fa-house mr-2"></i>
        Home
      </button>

    </section>

    <!-- Heading -->
    <div class="flex justify-between items-center mb-5">
      <h2 id="sectionTitle" class="text-2xl font-bold">
        Top 20 Cryptocurrencies
      </h2>
    </div>

    <!-- Loading -->
    <p
      id="loading"
      class="hidden text-center text-yellow-400 py-10"
    >
      <i class="fa-solid fa-spinner fa-spin mr-2"></i>
      Loading cryptocurrency data...
    </p>

    <!-- Error -->
    <p
      id="error"
      class="text-center text-red-400 py-5"
    ></p>

    <!-- Empty -->
    <p
      id="empty"
      class="text-center text-gray-400 py-5"
    ></p>

    <!-- Coins -->
    <section
      id="coinContainer"
      class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5"
    ></section>

    <!-- Detail View -->
    <section
      id="detailView"
      class="hidden bg-slate-900 border border-slate-700 rounded-xl p-6"
    ></section>

  </main>
  
  <footer class="text-center text-gray-500 p-6 mt-10 border-t border-slate-800">
    <i class="fa-solid fa-chart-line mr-2"></i>
    Crypto Market Tracker | Powered by CoinGecko API
  </footer>

  <script src="script.js"></script>

    
  </body>
  </html>
